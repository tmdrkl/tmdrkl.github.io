<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tomi@drkl ~ </title>
<meta name="description" content="Terminal pribadi drkl.my.id — landing page ala terminal. Tetris, kontak, dan hal-hal seru.">
<meta property="og:title" content="tomi@drkl ~">
<meta property="og:description" content="Terminal pribadi drkl.my.id — landing page ala terminal. Tetris, kontak, dan hal-hal seru.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://drkl.my.id/">
<meta name="theme-color" content="#2f343f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%232f343f'/%3E%3Ctext x='50' y='68' font-size='52' font-family='monospace' font-weight='bold' fill='%23a3be8c' text-anchor='middle'%3E%7E%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2f343f; --panel:#383c4a; --border:#4b5162;
    --text:#d3dae3; --muted:#8890a4; --blue:#5294e2;
    --green:#a3be8c; --yellow:#e5c07b; --red:#e06c75;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:'JetBrains Mono', ui-monospace, monospace; font-size:15px;
  }
  body{ display:flex; justify-content:center; align-items:flex-start; padding:40px 16px; }
  a{ color:var(--blue); }

  .wrap{ width:100%; max-width:700px; }

  header.site{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px; padding:0 2px;
  }
  header.site .brand{
    color:var(--text); font-weight:700; font-size:15px;
  }
  header.site .brand .dim{ color:var(--muted); font-weight:400; }
  header.site nav{ display:flex; gap:16px; }
  header.site nav a{
    color:var(--muted); font-size:13px; text-decoration:none;
  }
  header.site nav a:hover{ color:var(--blue); }

  footer.site{
    display:flex; align-items:center; justify-content:center; gap:18px;
    margin-top:14px; padding:0 2px;
  }
  footer.site a{
    color:var(--muted); font-size:13px; text-decoration:none;
  }
  footer.site a:hover{ color:var(--blue); }
  footer.site .sep{ color:var(--border); }

  .term{
    width:100%; max-width:700px;
    background:var(--panel); border:1px solid var(--border); border-radius:8px;
    box-shadow:0 20px 50px rgba(0,0,0,.35); overflow:hidden;
  }
  .titlebar{
    display:flex; align-items:center; gap:8px; padding:10px 14px;
    background:#363b46; border-bottom:1px solid var(--border);
  }
  .dot{ width:11px; height:11px; border-radius:50%; }
  .dot.r{ background:#e06c75; } .dot.y{ background:#e5c07b; } .dot.g{ background:#98c379; }
  .titlebar span{ margin-left:8px; color:var(--muted); font-size:13px; }

  #screen{
    height: 420px;
    overflow-y:auto;
    padding: 18px 20px;
    line-height:1.6;
  }
  #screen::-webkit-scrollbar{ width:8px; }
  #screen::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }

  .row{ white-space:pre-wrap; word-break:break-word; }
  .prompt{ color:var(--green); }
  .cmd{ color:var(--text); }
  .muted{ color:var(--muted); }
  .err{ color:var(--red); }
  .ok{ color:var(--yellow); }

  #inputline{ display:flex; align-items:center; gap:6px; }
  #inputline .prompt{ flex-shrink:0; }
  .inputwrap{ position:relative; flex:1; min-width:0; }
  #cmdInput{
    width:100%; padding:0; background:transparent; border:none; outline:none;
    color:var(--text); font-family:inherit; font-size:15px; caret-color:var(--blue);
    position:relative; z-index:1;
  }
  #suggest{
    position:absolute; left:0; top:0; z-index:0;
    color:var(--muted); opacity:.55; pointer-events:none;
    white-space:pre; visibility:hidden;
  }
  #suggestList{
    display:flex; flex-wrap:wrap; gap:4px 12px; padding:2px 0 6px; font-size:13px;
  }
  #suggestList span{ cursor:pointer; color:var(--blue); }
  #suggestList span.active{ background:var(--border); border-radius:3px; padding:0 4px; }
  #suggestList:empty{ display:none; }

  ul.helplist{ margin:4px 0 0; padding-left:18px; }
  ul.helplist li{ margin:2px 0; }

  @media (max-width: 480px){
    body{ padding:16px 10px; font-size:14px; }
    header.site nav{ gap:12px; }
    #screen{ height: 360px; padding: 14px; }
    .titlebar span{ display:none; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="site">
    <div class="brand">drkl<span class="dim">.my.id</span></div>
    <nav>
      <a href="tetris.html" target="_blank" rel="noopener">tetris</a>
    </nav>
  </header>

  <div class="term" id="term">
    <div class="titlebar">
      <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
      <span>tomi@drkl: ~</span>
    </div>
    <div id="screen">
      <div class="row muted">Selamat datang di terminal drkl.my.id. Ketik <span class="ok">help</span> untuk daftar perintah.</div>
      <div id="log"></div>
      <div class="row" id="inputline">
        <span class="prompt">tomi@drkl:~$</span>
        <div class="inputwrap">
          <input id="cmdInput" type="text" autocomplete="off" spellcheck="false" autofocus />
          <span id="suggest"></span>
        </div>
      </div>
      <div id="suggestList"></div>
    </div>
  </div>

  <footer class="site">
    <a href="https://github.com/tmdrkl" target="_blank" rel="noopener">github</a>
    <span class="sep">|</span>
    <a href="https://t.me/tmdrkl" target="_blank" rel="noopener">telegram</a>
    <span class="sep">|</span>
    <a href="mailto:to@drkl.my.id">email</a>
  </footer>

</div>

<script>
const log = document.getElementById('log');
const screen = document.getElementById('screen');
const input = document.getElementById('cmdInput');

function print(html, cls){
  const div = document.createElement('div');
  div.className = 'row' + (cls ? ' ' + cls : '');
  div.innerHTML = html;
  log.appendChild(div);
  screen.scrollTop = screen.scrollHeight;
}

function echo(cmd){
  print(`<span class="prompt">tomi@drkl:~$</span> <span class="cmd">${cmd}</span>`);
}

const commands = {
  help(){
    print(`Perintah yang tersedia:
<ul class="helplist">
  <li><span class="ok">about</span> — sedikit tentang saya</li>
  <li><span class="ok">links</span> — kontak & github</li>
  <li><span class="ok">tetris</span> — buka game Tetris</li>
  <li><span class="ok">clear</span> — bersihkan layar</li>
</ul>`);
  },
  about(){
    print(`Tomi — suka semua hal yang baru dan seru.`);
  },
  links(){
    print(`GitHub: <a href="https://github.com/tmdrkl" target="_blank" rel="noopener">github.com/tmdrkl</a>
Telegram: <a href="https://t.me/tmdrkl" target="_blank" rel="noopener">@tmdrkl</a>
Email: <a href="mailto:to@drkl.my.id">to@drkl.my.id</a>`);
  },
  tetris(){
    print(`Membuka <span class="ok">tetris.html</span> di tab baru... <a href="tetris.html" target="_blank" rel="noopener">klik di sini kalau tidak otomatis</a>`);
    window.open('tetris.html', '_blank');
  },
  play(){ commands.tetris(); },
  clear(){
    log.innerHTML = '';
  },
  whoami(){ print('tomi'); },
};

const suggestEl = document.getElementById('suggest');
const suggestList = document.getElementById('suggestList');
const commandList = Object.keys(commands);
const history = [];
let histIdx = -1;
let pendingHist = '';
let tabIdx = -1;

function getMatches(val){
  const v = val.toLowerCase();
  if (!v) return [];
  return commandList.filter(c => c.toLowerCase().startsWith(v));
}

function setInput(v){
  input.value = v;
  input.setSelectionRange(v.length, v.length);
}

function renderSuggestion(){
  const val = input.value;
  const m = getMatches(val);
  if (m.length === 1 && m[0].length > val.length) {
    suggestEl.textContent = m[0].slice(val.length);
    suggestEl.style.visibility = 'visible';
  } else {
    suggestEl.textContent = '';
    suggestEl.style.visibility = 'hidden';
  }
  return m;
}

function acceptSuggestion(){
  const m = getMatches(input.value);
  if (m.length === 1 && m[0].length > input.value.length) {
    setInput(m[0]);
    renderSuggestion();
  }
}

function hideList(){
  suggestList.innerHTML = '';
  tabIdx = -1;
}

function showList(m, active){
  suggestList.innerHTML = '';
  m.forEach((c, i) => {
    const s = document.createElement('span');
    if (i === active) s.className = 'active';
    s.textContent = c;
    s.addEventListener('click', () => { setInput(c); hideList(); renderSuggestion(); input.focus(); });
    suggestList.appendChild(s);
  });
}

function doTab(){
  const m = getMatches(input.value);
  if (!m.length) { hideList(); return; }
  if (m.length === 1) {
    setInput(m[0]);
    hideList();
  } else {
    tabIdx = (tabIdx + 1) % m.length;
    setInput(m[tabIdx]);
    showList(m, tabIdx);
  }
  renderSuggestion();
}

function goHistory(dir){
  if (!history.length) return;
  if (histIdx === -1) pendingHist = input.value;
  histIdx += dir;
  if (histIdx < 0) {
    histIdx = -1;
    setInput(pendingHist);
  } else {
    if (histIdx >= history.length) histIdx = history.length - 1;
    setInput(history[histIdx]);
  }
  renderSuggestion();
  hideList();
}

input.addEventListener('input', () => { renderSuggestion(); });

input.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') { e.preventDefault(); doTab(); return; }
  if (e.key === 'ArrowRight') { if (input.selectionStart === input.value.length) acceptSuggestion(); return; }
  if (e.key === 'ArrowUp') { e.preventDefault(); goHistory(-1); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); goHistory(1); return; }
  if (e.key !== 'Enter') return;
  const raw = input.value.trim();
  input.value = '';
  hideList();
  renderSuggestion();
  if (!raw) return;
  echo(raw);
  if (raw !== history[history.length - 1]) history.push(raw);
  histIdx = -1;
  const key = raw.toLowerCase();
  if (commands[key]) {
    commands[key]();
  } else {
    print(`command not found: ${raw}. Ketik <span class="ok">help</span>.`, 'err');
  }
});

document.getElementById('term').addEventListener('click', () => input.focus());
</script>

</body>
</html>
