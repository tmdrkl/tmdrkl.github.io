<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>drkl.net</title>
  <meta name="description" content="drkl.net — interactive web terminal with built-in AI chat. Terminal, blog, and AI bot on a single page.">
  <meta name="theme-color" content="#1d2021">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%23282828'/%3E%3Ctext x='50' y='68' font-size='52' font-family='monospace' font-weight='bold' fill='%23a9b665' text-anchor='middle'%3E%7E%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="theme-tokens.css?v=1">
  <link rel="stylesheet" href="style.css?v=9">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('drkl_theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="drkl.net">
  <meta property="og:title" content="drkl.net">
  <meta property="og:description" content="Interactive web terminal with built-in AI chat. Type `chat` to start talking.">
  <meta property="og:url" content="https://drkl.net/">
  <meta property="og:image" content="https://drkl.net/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="drkl.net">
  <meta name="twitter:description" content="Interactive web terminal with built-in AI chat.">
  <meta name="twitter:image" content="https://drkl.net/og.png">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "drkl.net",
    "url": "https://drkl.net/",
    "description": "Interactive web terminal with built-in AI chat.",
    "author": {
      "@type": "Person",
      "name": "Tomi",
      "url": "https://github.com/tmdrkl",
      "sameAs": ["https://t.me/tmdrkl", "mailto:to@drkl.net"]
    }
  }
  </script>
</head>
<body>

<a class="skip-link" href="#cmdInput">Skip to terminal input</a>

<div class="wrap">
  <h1 class="sr-only">guest@drkl — interactive terminal and AI chat at drkl.net</h1>
  <header class="site">
    <div class="brand">drkl<span class="dim">.net</span></div>
    <nav aria-label="Site controls">
      <button class="theme-btn" id="themeToggle" type="button" aria-label="Switch to light theme"></button>
    </nav>
  </header>

  <main class="term" id="term">
    <div class="titlebar" aria-hidden="true">
      <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
      <span id="titleText">guest@drkl: ~</span>
    </div>
    <div id="screen" role="log" aria-live="polite">
      <div id="log"></div>
      <div id="inputbar">
        <div class="mobile-keys" aria-hidden="false">
          <button type="button" class="mkey" data-key="Tab" aria-label="Tab autocomplete" tabindex="-1">tab</button>
          <button type="button" class="mkey" data-key="ArrowLeft" aria-label="Move cursor left" tabindex="-1">←</button>
          <button type="button" class="mkey" data-key="ArrowUp" aria-label="Previous command" tabindex="-1">↑</button>
          <button type="button" class="mkey" data-key="ArrowDown" aria-label="Next command" tabindex="-1">↓</button>
          <button type="button" class="mkey" data-key="ArrowRight" aria-label="Move cursor right" tabindex="-1">→</button>
        </div>
        <div class="row" id="inputline">
          <span class="prompt" id="prompt">guest@drkl:~$</span>
          <div class="inputwrap">
            <input id="cmdInput" type="text" autocomplete="off" spellcheck="false" autocapitalize="off" enterkeyhint="send" autofocus aria-label="Terminal command">
            <span id="suggest" aria-hidden="true"></span>
          </div>
        </div>
        <div id="suggestList"></div>
      </div>
    </div>
  </main>

  <footer class="site">
    <a href="https://github.com/tmdrkl" target="_blank" rel="noopener">github</a>
    <span class="sep">|</span>
    <a href="https://t.me/tmdrkl" target="_blank" rel="noopener">telegram</a>
    <span class="sep">|</span>
    <a href="mailto:to@drkl.net">email</a>
  </footer>
</div>

<script type="module" src="index.js?v=22"></script>
</body>
</html>
