<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>tomi@drkl ~</title>
  <meta name="description" content="drkl.my.id — terminal with built-in AI chat">
  <meta name="theme-color" content="#2e3440">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%232e3440'/%3E%3Ctext x='50' y='68' font-size='52' font-family='monospace' font-weight='bold' fill='%23a3be8c' text-anchor='middle'%3E%7E%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<div class="wrap">
  <header class="site">
    <div class="brand">drkl<span class="dim">.my.id</span></div>
    <nav>
      <button class="theme-btn" id="themeToggle" aria-label="Toggle theme"></button>
    </nav>
  </header>

  <div class="term" id="term">
    <div class="titlebar">
      <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
      <span id="titleText">tomi@drkl: ~</span>
    </div>
    <div id="screen" role="log" aria-live="polite">
      <div id="log"></div>
      <div class="row" id="inputline">
        <span class="prompt" id="prompt">tomi@drkl:~$</span>
        <div class="inputwrap">
          <input id="cmdInput" type="text" autocomplete="off" spellcheck="false" autofocus aria-label="Terminal command">
          <span id="suggest"></span>
        </div>
      </div>
      <div id="suggestList"></div>
    </div>
  </div>

  <footer class="site">
    <a href="https://github.com/tmdrkl" target="_blank" rel="noopener">github</a>
    <span class="sep">|</span>
    <a href="https://t.me/tmdrkl" target="_blank" rel="noopener">telegram</a>
    <span class="sep">|</span>
    <a href="mailto:to@drkl.my.id">email</a>
  </footer>
</div>

<script type="module" src="index.js?v=2"></script>
</body>
</html>
