<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — drkl.net</title>
<meta name="robots" content="noindex">
<script>(function(){try{var t=localStorage.getItem('drkl_theme');if(t!=='dark'&&t!=='light'){t=(matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="theme-tokens.css?v=6">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100vh;background:var(--page-bg,var(--bg,#232a2e));color:var(--text,#d3c6aa);font-family:'Adwaita Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
body{display:flex;align-items:center;justify-content:center;padding:24px}
.term{width:100%;max-width:560px;background:var(--panel,#2d353b);border:1px solid var(--border,#475258);border-radius:12px;overflow:hidden;box-shadow:var(--term-shadow,0 0 0 1px rgba(0,0,0,0.3),0 14px 34px rgba(0,0,0,0.35))}
.titlebar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel2,#343f44);border-bottom:1px solid var(--border,#475258)}
.dot{width:11px;height:11px;border-radius:50%}.r{background:var(--red,#e67e80)}.y{background:var(--yellow,#dbbc7f)}.g{background:var(--green,#a7c080)}
.body{padding:20px;line-height:1.6}.prompt{color:var(--green,#a7c080)}a{color:var(--blue,#7fbbb3)}
</style>
</head>
<body>
<main class="term">
<div class="titlebar" aria-hidden="true"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div>
<div class="body">
<div><span class="prompt">guest@drkl:~$</span> cd /lost+found</div>
<div>404: no such file or directory.</div>
<p><a href="/">← back to terminal</a></p>
</div>
</main>
</body>
</html>
