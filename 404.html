<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — drkl.net</title>
<meta name="robots" content="noindex">
<script>(function(){try{var t=localStorage.getItem('drkl_theme');if(t!=='dark'&&t!=='light'){t=(matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="theme-tokens.css?v=4">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100vh;background:var(--page-bg,var(--bg,#081512));color:var(--text,#e9fff2);font-family:'Adwaita Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
body{display:flex;align-items:center;justify-content:center;padding:24px}
.term{width:100%;max-width:560px;background:var(--panel,#0c1f1a);border:1px solid var(--border,rgba(134,255,180,0.18));border-radius:12px;overflow:hidden;box-shadow:var(--term-shadow,0 20px 50px rgba(0,0,0,0.55))}
.titlebar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel2,#113029);border-bottom:1px solid var(--border,rgba(134,255,180,0.18))}
.dot{width:11px;height:11px;border-radius:50%}.r{background:#ff6f61}.y{background:#eaf54a}.g{background:#5ef08a}
.body{padding:20px;line-height:1.6}.prompt{color:var(--green,#5ef08a)}a{color:var(--blue,#a3f05a)}
</style>
</head>
<body>
<main class="term">
<div class="titlebar" aria-hidden="true"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div>
<div class="body">
<div><span class="prompt">guest@drkl:~$</span> cd /lost+found</div>
<div>404: no such file or directory.</div>
<p><a href="/">← back to terminal</a></p>
</div>
</main>
</body>
</html>
