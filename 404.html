<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — drkl.net</title>
<meta name="robots" content="noindex">
<script>(function(){try{var t=localStorage.getItem('drkl_theme');if(t!=='dark'&&t!=='light'){t=(matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="theme-tokens.css?v=2">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100vh;background:var(--bg,#1d2021);color:var(--text,#d4be98);font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
body{display:flex;align-items:center;justify-content:center;padding:24px}
.term{width:100%;max-width:560px;background:var(--panel,#282828);border:1px solid var(--border,#665c54);border-radius:8px;overflow:hidden}
.titlebar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel2,#32302f);border-bottom:1px solid var(--border,#665c54)}
.dot{width:11px;height:11px;border-radius:50%}.r{background:#fb4934}.y{background:#fe8019}.g{background:#b8bb26}
.body{padding:20px;line-height:1.6}.prompt{color:var(--green,#b8bb26)}a{color:var(--blue,#83a598)}
</style>
</head>
<body>
<main class="term">
<div class="titlebar" aria-hidden="true"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div>
<div class="body">
<div><span class="prompt">guest@drkl:~$</span> cd /lost+found</div>
<div>404: no such file or directory.</div>
<p><a href="/">← back to terminal</a></p>
</div>
</main>
</body>
</html>
