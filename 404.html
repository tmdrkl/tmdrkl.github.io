<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — drkl.net</title>
<meta name="robots" content="noindex">
<script>(function(){try{var t=localStorage.getItem('drkl_theme');if(t!=='dark'&&t!=='light'){t=(matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="theme-tokens.css?v=5">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100vh;background:var(--page-bg,var(--bg,#222226));color:var(--text,#ffffff);font-family:'Adwaita Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
body{display:flex;align-items:center;justify-content:center;padding:24px}
.term{width:100%;max-width:560px;background:var(--panel,#1d1d20);border:1px solid var(--border,rgba(255,255,255,0.15));border-radius:12px;overflow:hidden;box-shadow:var(--term-shadow,0 0 0 1px rgba(0,0,0,0.35),0 12px 32px rgba(0,0,0,0.45))}
.titlebar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel2,#2e2e32);border-bottom:1px solid var(--border,rgba(255,255,255,0.15))}
.dot{width:11px;height:11px;border-radius:50%}.r{background:#ff877b}.y{background:#ffc13f}.g{background:#8ff0a4}
.body{padding:20px;line-height:1.6}.prompt{color:var(--green,#8ff0a4)}a{color:var(--blue,#78e9ab)}
</style>
</head>
<body>
<main class="term">
<div class="titlebar" aria-hidden="true"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div>
<div class="body">
<div><span class="prompt">guest@drkl:~$</span> cd /lost+found</div>
<div>404: no such file or directory.</div>
<p><a href="/">← back to terminal</a></p>
</div>
</main>
</body>
</html>
