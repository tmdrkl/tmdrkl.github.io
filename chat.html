<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AI Chat — drkl.my.id</title>
  <meta name="theme-color" content="#2e3440">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="chat-wrap">
  <header>
    <a href="index.html" class="back-link">←</a>
    <h1>AI Chat</h1>
    <select id="model-select" title="Model"></select>
    <button class="theme-btn" id="themeToggle" aria-label="Toggle theme"></button>
  </header>
  <div id="status"></div>
  <div id="messages"></div>
  <div id="composer">
    <textarea id="input" rows="1" placeholder="Type a message..." aria-label="Message" autocomplete="off"></textarea>
    <button id="send">Send</button>
  </div>
</div>
<script type="module" src="chat.js"></script>
</body>
</html>
