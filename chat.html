<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat - Groq</title>
<meta name="theme-color" content="#2e3440">
<link rel="stylesheet" href="style.css" id="theme-css">
<script type="module" src="chat.js"></script>
</head>
<body>
<div class="chat-wrap">
<header>
  <h1>AI Chat</h1>
  <select id="model-select" title="Pilih model"></select>
  <button class="theme-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle dark/light theme"></button>
</header>
<div id="status"></div>
<div id="messages"></div>
<div id="composer">
  <textarea id="input" rows="2" placeholder="Tulis pesan..." aria-label="Pesan" autocomplete="off"></textarea>
  <button id="send">Kirim</button>
</div>
</div>
</body>
</html>
