<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat - Groq</title>
<meta name="theme-color" content="#2e3440">
<link rel="stylesheet" href="style.css" id="theme-css">
<script src="theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js" defer></script>
</head>
<body>
<div class="chat-wrap">
<header>
  <h1>AI Chat</h1>
  <select id="model-select" title="Pilih model"></select>
  <button class="theme-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle dark/light theme"></button>
</header>
<div id="status"></div>
<div id="messages"></div>
<div id="composer">
  <textarea id="input" rows="1" placeholder="Tulis pesan..." aria-label="Pesan"></textarea>
  <button id="send">Kirim</button>
</div>
</div>

<script>
// --- Theme toggle ---
document.getElementById('themeToggle').addEventListener('click', () => {
  const cur = getTheme();
  const next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
  setTheme(next);
  themeRainBurst(next);
});

const WORKER_URL = "https://groq-chat.tomx13.workers.dev";

const modelSelect = document.getElementById("model-select");
const messagesEl = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");

let history = [];

function addMessage(role, content, error = false) {
  const div = document.createElement("div");
  div.className = `msg ${role}` + (error ? " error" : "");
  div.textContent = content;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function setStatus(text) {
  statusEl.textContent = text;
}

function renderMarkdown(el, text) {
  if (typeof marked !== "undefined" && typeof DOMPurify !== "undefined") {
    el.classList.add("md");
    const html = marked.parse(text, { breaks: true });
    el.innerHTML = DOMPurify.sanitize(html);
  } else {
    el.textContent = text;
  }
}

let typingTimer = null;
function startTyping(el, getTarget, isDone) {
  stopTyping();
  el._shown = 0;
  el.classList.add("typing");
  typingTimer = setInterval(() => {
    const target = getTarget().replace(/<br\s*\/?>/gi, "\n");
    if (el._shown < target.length) {
      const step = 3;
      el._shown = Math.min(target.length, el._shown + step);
      el.textContent = target.slice(0, el._shown);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    if (isDone() && el._shown >= target.length) {
      stopTyping();
      el.classList.remove("typing");
      renderMarkdown(el, target);
    }
  }, 25);
}

function stopTyping() {
  if (typingTimer) {
    clearInterval(typingTimer);
    typingTimer = null;
  }
}

async function loadModels() {
  setStatus("Memuat daftar model...");
  try {
    const res = await fetch(`${WORKER_URL}/models`);
    if (!res.ok) throw new Error((await res.text()).slice(0, 200));
    const data = await res.json();
    const models = Array.isArray(data.models) ? data.models : [];
    models.forEach((m) => {
      const opt = document.createElement("option");
      opt.value = m;
      opt.textContent = m;
      modelSelect.appendChild(opt);
    });
    if (models.length) {
      const preferred = "openai/gpt-oss-120b";
      if (models.includes(preferred)) modelSelect.value = preferred;
      setStatus("");
    } else {
      setStatus("Tidak ada model ditemukan.");
    }
  } catch (e) {
    setStatus(`Gagal memuat model: ${e.message}`);
  }
}

async function sendMessage(text) {
  const model = modelSelect.value;
  if (!model) {
    addMessage("bot", "Pilih model terlebih dahulu.", true);
    return;
  }

  history.push({ role: "user", content: text });
  addMessage("user", text);

  const reply = addMessage("bot", "");
  reply.classList.add("typing");
  sendBtn.disabled = true;
  input.value = "";
  input.focus();

  try {
    const res = await fetch(`${WORKER_URL}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model, messages: history }),
    });

    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || `HTTP ${res.status}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let full = "";
    let streamDone = false;

    startTyping(reply, () => full, () => streamDone);

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, idx).trim();
        buffer = buffer.slice(idx + 1);
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;
        try {
          const json = JSON.parse(payload);
          const delta = json.choices?.[0]?.delta?.content;
          if (delta) full += delta;
        } catch { /* abaikan fragmen */ }
      }
    }
    streamDone = true;

    if (!full) {
      stopTyping();
      reply.classList.remove("typing");
      renderMarkdown(reply, "(tidak ada respons)");
    }
    history.push({ role: "assistant", content: full });
  } catch (e) {
    stopTyping();
    reply.classList.remove("typing");
    reply.textContent = `Error: ${e.message}`;
    reply.className = "msg bot error";
    history.pop();
  } finally {
    sendBtn.disabled = false;
    setStatus("");
  }
}

sendBtn.addEventListener("click", () => {
  const text = input.value.trim();
  if (text) sendMessage(text);
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const text = input.value.trim();
    if (text) sendMessage(text);
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});

loadModels();
if (/Mobi|Android|iPhone/i.test(navigator.userAgent)) input.focus();
</script>
</body>
</html>
