<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat - Groq</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --border: #262a36;
    --text: #e6e8ee;
    --muted: #9aa0b0;
    --accent: #f55036;
    --user: #2a2f3e;
    --bot: #1c2030;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 16px; font-weight: 600; flex: 1; }
  #model-select {
    background: var(--user);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    max-width: 260px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user { background: var(--user); align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.error { background: #3a1f22; color: #ffb4a1; align-self: flex-start; }
  .msg .source { display: block; margin-top: 8px; font-size: 11px; color: var(--muted); }
  .typing::after {
    content: "▋";
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #composer {
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    background: var(--panel);
    display: flex;
    gap: 10px;
    align-items: center;
  }
  #input {
    flex: 1;
    background: var(--user);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    resize: none;
    max-height: 140px;
    outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { font-size: 12px; color: var(--muted); padding: 6px 20px 0; }
  .msg.md p { margin: 0 0 8px; }
  .msg.md p:last-child { margin-bottom: 0; }
  .msg.md h1, .msg.md h2, .msg.md h3, .msg.md h4 {
    margin: 10px 0 6px; font-size: 1.05em; line-height: 1.3;
  }
  .msg.md ul, .msg.md ol { margin: 4px 0 8px; padding-left: 20px; }
  .msg.md li { margin: 2px 0; }
  .msg.md code {
    background: rgba(0,0,0,.35); padding: 1px 5px; border-radius: 4px;
    font-family: ui-monospace, monospace; font-size: 12.5px;
  }
  .msg.md pre {
    background: rgba(0,0,0,.35); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; margin: 6px 0 10px;
  }
  .msg.md pre code { background: none; padding: 0; border-radius: 0; }
  .msg.md blockquote {
    border-left: 3px solid var(--accent); margin: 6px 0; padding: 2px 10px;
    color: var(--muted);
  }
  .msg.md a { color: var(--accent); }
  .msg.md table { border-collapse: collapse; margin: 6px 0; font-size: 13px; }
  .msg.md th, .msg.md td { border: 1px solid var(--border); padding: 4px 10px; }
  .msg.md hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
<header>
  <h1>AI Chat</h1>
  <select id="model-select" title="Pilih model"></select>
</header>
<div id="status"></div>
<div id="messages"></div>
<div id="composer">
  <textarea id="input" rows="1" placeholder="Tulis pesan..." aria-label="Pesan"></textarea>
  <button id="send">Kirim</button>
</div>

<script>
const WORKER_URL = "https://groq-chat.tomx13.workers.dev";

const modelSelect = document.getElementById("model-select");
const messagesEl = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");

let history = [];

function addMessage(role, content, error = false) {
  const div = document.createElement("div");
  div.className = `msg ${role}` + (error ? " error" : "");
  div.textContent = content;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function setStatus(text) {
  statusEl.textContent = text;
}

function renderMarkdown(el, text) {
  if (typeof marked !== "undefined" && typeof DOMPurify !== "undefined") {
    el.classList.add("md");
    const html = marked.parse(text, { breaks: true });
    el.innerHTML = DOMPurify.sanitize(html);
  } else {
    el.textContent = text;
  }
}

let typingTimer = null;
function startTyping(el, getTarget, isDone) {
  stopTyping();
  el._shown = 0;
  el.classList.add("typing");
  typingTimer = setInterval(() => {
    const target = getTarget().replace(/<br\s*\/?>/gi, "\n");
    if (el._shown < target.length) {
      const step = 3;
      el._shown = Math.min(target.length, el._shown + step);
      el.textContent = target.slice(0, el._shown);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    if (isDone() && el._shown >= target.length) {
      stopTyping();
      el.classList.remove("typing");
      renderMarkdown(el, target);
    }
  }, 25);
}

function stopTyping() {
  if (typingTimer) {
    clearInterval(typingTimer);
    typingTimer = null;
  }
}

async function loadModels() {
  setStatus("Memuat daftar model...");
  try {
    const res = await fetch(`${WORKER_URL}/models`);
    if (!res.ok) throw new Error((await res.text()).slice(0, 200));
    const data = await res.json();
    const models = Array.isArray(data.models) ? data.models : [];
    models.forEach((m) => {
      const opt = document.createElement("option");
      opt.value = m;
      opt.textContent = m;
      modelSelect.appendChild(opt);
    });
    if (models.length) {
      const preferred = "openai/gpt-oss-120b";
      if (models.includes(preferred)) modelSelect.value = preferred;
      setStatus("");
    } else {
      setStatus("Tidak ada model ditemukan.");
    }
  } catch (e) {
    setStatus(`Gagal memuat model: ${e.message}`);
  }
}

async function sendMessage(text) {
  const model = modelSelect.value;
  if (!model) {
    addMessage("bot", "Pilih model terlebih dahulu.", true);
    return;
  }

  history.push({ role: "user", content: text });
  addMessage("user", text);

  const reply = addMessage("bot", "");
  reply.classList.add("typing");
  sendBtn.disabled = true;
  input.value = "";
  input.focus();

  try {
    const res = await fetch(`${WORKER_URL}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model, messages: history }),
    });

    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || `HTTP ${res.status}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let full = "";
    let streamDone = false;

    startTyping(reply, () => full, () => streamDone);

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, idx).trim();
        buffer = buffer.slice(idx + 1);
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;
        try {
          const json = JSON.parse(payload);
          const delta = json.choices?.[0]?.delta?.content;
          if (delta) full += delta;
        } catch { /* abaikan fragmen */ }
      }
    }
    streamDone = true;

    if (!full) {
      stopTyping();
      reply.classList.remove("typing");
      renderMarkdown(reply, "(tidak ada respons)");
    }
    history.push({ role: "assistant", content: full });
  } catch (e) {
    stopTyping();
    reply.classList.remove("typing");
    reply.textContent = `Error: ${e.message}`;
    reply.className = "msg bot error";
    history.pop();
  } finally {
    sendBtn.disabled = false;
    setStatus("");
  }
}

sendBtn.addEventListener("click", () => {
  const text = input.value.trim();
  if (text) sendMessage(text);
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const text = input.value.trim();
    if (text) sendMessage(text);
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});

loadModels();
</script>
</body>
</html>
