<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat - Groq</title>
<meta name="theme-color" content="#2e3440">
<script>
var t=localStorage.getItem('drkl_theme');if(t!=='dark'&&t!=='light')t='dark';
document.documentElement.setAttribute('data-theme',t);
document.write('<link rel="stylesheet" href="'+t+'.css" id="theme-css">');
</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
<div class="chat-wrap">
<header>
  <h1>AI Chat</h1>
  <select id="model-select" title="Pilih model"></select>
  <button class="theme-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle dark/light theme"></button>
</header>
<div id="status"></div>
<div id="messages"></div>
<div id="composer">
  <textarea id="input" rows="1" placeholder="Tulis pesan..." aria-label="Pesan"></textarea>
  <button id="send">Kirim</button>
</div>
</div>

<script>
// --- Theme toggle ---
const THEMES = ['dark','light'];
const THEME_META = { dark:'#2e3440', light:'#eceff4' };
function getTheme(){ var v=localStorage.getItem('drkl_theme'); return (v==='dark'||v==='light')?v:'dark'; }
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('drkl_theme', t);
  const link = document.getElementById('theme-css');
  if (link) link.href = t + '.css';
  const btn = document.getElementById('themeToggle');
  if (btn) { btn.textContent = t === 'light' ? '🌙' : '☀️'; btn.classList.add('switching'); setTimeout(() => btn.classList.remove('switching'), 420); }
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = THEME_META[t] || '#2e3440';
}
function themeRainBurst(theme){var c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;z-index:9999;width:100%;height:100%;pointer-events:none;transition:opacity .35s ease';document.body.appendChild(c);var ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;var ch='\u30a2\u30a4\u30a6\u30a8\u30aa\u30ab\u30ad\u30af\u30b1\u30b3\u30b5\u30b7\u30b9\u30bb\u30bd\u30bf\u30c1\u30c4\u30c6\u30c8\u30ca\u30cb\u30cc\u30cd\u30ce0123456789$#@%&+=;:~';var fs=14,cols=Math.floor(c.width/fs);var drops=[];for(var i=0;i<cols;i++)drops.push(Math.random()*-30);var bg=theme==='light'?'rgba(236,239,244,0.12)':'rgba(46,52,64,0.12)';var fg=theme==='light'?'rgba(94,129,172,0.85)':'rgba(163,190,140,0.85)';var t0=performance.now();(function frame(){ctx.fillStyle=bg;ctx.fillRect(0,0,c.width,c.height);ctx.font=fs+'px monospace';ctx.fillStyle=fg;for(var j=0;j<cols;j++){ctx.fillText(ch[Math.random()*ch.length|0],j*fs,drops[j]*fs);if(drops[j]*fs>c.height&&Math.random()>0.975)drops[j]=0;drops[j]++;}if(performance.now()-t0<700)requestAnimationFrame(frame);else{c.style.opacity='0';setTimeout(function(){c.remove();},350);}})();}
setTheme(getTheme());
document.getElementById('themeToggle').addEventListener('click', () => {
  const cur = getTheme();
  const next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
  setTheme(next);
  themeRainBurst(next);
});

const WORKER_URL = "https://groq-chat.tomx13.workers.dev";

const modelSelect = document.getElementById("model-select");
const messagesEl = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");

let history = [];

function addMessage(role, content, error = false) {
  const div = document.createElement("div");
  div.className = `msg ${role}` + (error ? " error" : "");
  div.textContent = content;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function setStatus(text) {
  statusEl.textContent = text;
}

function renderMarkdown(el, text) {
  if (typeof marked !== "undefined" && typeof DOMPurify !== "undefined") {
    el.classList.add("md");
    const html = marked.parse(text, { breaks: true });
    el.innerHTML = DOMPurify.sanitize(html);
  } else {
    el.textContent = text;
  }
}

let typingTimer = null;
function startTyping(el, getTarget, isDone) {
  stopTyping();
  el._shown = 0;
  el.classList.add("typing");
  typingTimer = setInterval(() => {
    const target = getTarget().replace(/<br\s*\/?>/gi, "\n");
    if (el._shown < target.length) {
      const step = 3;
      el._shown = Math.min(target.length, el._shown + step);
      el.textContent = target.slice(0, el._shown);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    if (isDone() && el._shown >= target.length) {
      stopTyping();
      el.classList.remove("typing");
      renderMarkdown(el, target);
    }
  }, 25);
}

function stopTyping() {
  if (typingTimer) {
    clearInterval(typingTimer);
    typingTimer = null;
  }
}

async function loadModels() {
  setStatus("Memuat daftar model...");
  try {
    const res = await fetch(`${WORKER_URL}/models`);
    if (!res.ok) throw new Error((await res.text()).slice(0, 200));
    const data = await res.json();
    const models = Array.isArray(data.models) ? data.models : [];
    models.forEach((m) => {
      const opt = document.createElement("option");
      opt.value = m;
      opt.textContent = m;
      modelSelect.appendChild(opt);
    });
    if (models.length) {
      const preferred = "openai/gpt-oss-120b";
      if (models.includes(preferred)) modelSelect.value = preferred;
      setStatus("");
    } else {
      setStatus("Tidak ada model ditemukan.");
    }
  } catch (e) {
    setStatus(`Gagal memuat model: ${e.message}`);
  }
}

async function sendMessage(text) {
  const model = modelSelect.value;
  if (!model) {
    addMessage("bot", "Pilih model terlebih dahulu.", true);
    return;
  }

  history.push({ role: "user", content: text });
  addMessage("user", text);

  const reply = addMessage("bot", "");
  reply.classList.add("typing");
  sendBtn.disabled = true;
  input.value = "";
  input.focus();

  try {
    const res = await fetch(`${WORKER_URL}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model, messages: history }),
    });

    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || `HTTP ${res.status}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let full = "";
    let streamDone = false;

    startTyping(reply, () => full, () => streamDone);

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, idx).trim();
        buffer = buffer.slice(idx + 1);
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;
        try {
          const json = JSON.parse(payload);
          const delta = json.choices?.[0]?.delta?.content;
          if (delta) full += delta;
        } catch { /* abaikan fragmen */ }
      }
    }
    streamDone = true;

    if (!full) {
      stopTyping();
      reply.classList.remove("typing");
      renderMarkdown(reply, "(tidak ada respons)");
    }
    history.push({ role: "assistant", content: full });
  } catch (e) {
    stopTyping();
    reply.classList.remove("typing");
    reply.textContent = `Error: ${e.message}`;
    reply.className = "msg bot error";
    history.pop();
  } finally {
    sendBtn.disabled = false;
    setStatus("");
  }
}

sendBtn.addEventListener("click", () => {
  const text = input.value.trim();
  if (text) sendMessage(text);
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const text = input.value.trim();
    if (text) sendMessage(text);
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});

loadModels();
if (/Mobi|Android|iPhone/i.test(navigator.userAgent)) input.focus();
</script>
</body>
</html>
