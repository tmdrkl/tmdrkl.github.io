<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="A simple Tetris from drkl.my.id. Play directly in the browser.">
<meta property="og:title" content="Tetris drkl.my.id">
<meta property="og:description" content="A simple Tetris from drkl.my.id. Play directly in the browser.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#2e3440">
<title>Tetris</title>
<link rel="stylesheet" href="style.css" id="theme-css">
<script type="module" src="tetris.js"></script>
</head>
<body>

<div class="container">
  <div id="board"></div>
  <div class="panel">
    <h1>🎮 Tetris <button class="theme-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle dark/light theme"></button></h1>
    <div class="box">
      <div class="score" id="score" aria-live="polite" aria-label="Score">0</div>
      <div class="stats">
        Best <b id="highScore">0</b><span class="sep"> · </span>Lv <b id="level" aria-live="polite" aria-label="Level">1</b><span class="sep"> · </span>Lines <b id="lines" aria-live="polite" aria-label="Lines cleared">0</b>
      </div>
    </div>
    <div class="box minis">
      <div class="mini">
        <h3>NEXT</h3>
        <div id="next"></div>
      </div>
      <div class="mini">
        <h3>HOLD</h3>
        <div id="hold"></div>
      </div>
    </div>
    <div class="touchbtns" id="touchBtns">
      <button id="btnLeft" aria-label="Left">◀</button>
      <button id="btnRight" aria-label="Right">▶</button>
      <button id="btnDown" aria-label="Down">▼</button>
      <button id="btnRotate" aria-label="Rotate">↻</button>
      <button id="btnHold" aria-label="Hold">⇄</button>
    </div>
    <details class="box controls" id="controlsGuide">
      <summary><h3>CONTROLS</h3></summary>
      <div class="control-section">
        <h4>Keyboard</h4>
        <div class="control-row"><kbd>←</kbd><kbd>→</kbd><span>Move</span></div>
        <div class="control-row"><kbd>↓</kbd><span>Soft drop</span></div>
        <div class="control-row"><kbd>↑</kbd><span>Rotate</span></div>
        <div class="control-row"><kbd>Space</kbd><span>Hard drop</span></div>
        <div class="control-row"><kbd>C</kbd><span>Hold</span></div>
        <div class="control-row"><kbd>P</kbd><span>Pause</span></div>
      </div>
      <div class="control-section">
        <h4>Touch</h4>
        <div class="control-row"><span class="touch-desc">Swipe ←/→</span><span>Move</span></div>
        <div class="control-row"><span class="touch-desc">Tap board</span><span>Rotate</span></div>
        <div class="control-row"><span class="touch-desc">Swipe ↓</span><span>Soft drop</span></div>
        <div class="control-row"><span class="touch-desc">Swipe ↓↓</span><span>Hard drop</span></div>
        <div class="control-row"><span class="touch-desc">Bottom buttons</span><span>Actions</span></div>
      </div>
    </details>
    <div class="btnrow">
      <button id="startBtn">Start</button>
      <button id="pauseBtn" aria-label="Pause">⏸</button>
      <button id="musicBtn" aria-label="Music">🔊</button>
    </div>
  </div>
</div>

<div id="overlay">
  <div id="overlayText">GAME OVER</div>
  <div class="sub" id="overlaySub"></div>
  <button id="overlayBtn">Play Again</button>
</div>
</body>
</html>
