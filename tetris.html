<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Tetris sederhana dari drkl.my.id. Main langsung di browser.">
<meta property="og:title" content="Tetris drkl.my.id">
<meta property="og:description" content="Tetris sederhana dari drkl.my.id. Main langsung di browser.">
<meta property="og:type" content="website">
<title>Tetris Sederhana</title>
<style>
  * { touch-action: manipulation; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e1e2e;
    font-family: 'Courier New', monospace;
    color: #cdd6f4;
    padding: 16px;
    box-sizing: border-box;
  }
  .container {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }

  @media (max-width: 640px) {
    #board { grid-template-columns: repeat(10, 26px); grid-template-rows: repeat(20, 26px); }
    .cell { width: 26px; height: 26px; }
    .panel .box.controls:not(#touchHint) { display: none; }
    #touchHint { display: block !important; }
    .touchbtns { display: grid !important; }
  }
  #board {
    background: #181825;
    border: 4px solid #45475a;
    border-radius: 8px;
    display: grid;
    grid-template-columns: repeat(10, 28px);
    grid-template-rows: repeat(20, 28px);
    gap: 1px;
    user-select: none;
  }
  .cell {
    width: 28px;
    height: 28px;
    background: #11111b;
    border-radius: 2px;
  }
  .panel {
    width: 180px;
  }
  .panel h1 {
    font-size: 20px;
    margin-bottom: 8px;
    color: #f5c2e7;
  }
  .box {
    background: #181825;
    border: 2px solid #45475a;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 16px;
  }
  .box h3 {
    margin: 0 0 8px 0;
    font-size: 14px;
    color: #94e2d5;
  }
  #next {
    display: grid;
    grid-template-columns: repeat(4, 20px);
    grid-template-rows: repeat(4, 20px);
    gap: 1px;
    margin: 0 auto;
  }
  #next .cell { width: 20px; height: 20px; }
  .score { font-size: 22px; color: #a6e3a1; }
  .high { font-size: 13px; color: #f5c2e7; margin-top: 4px; }
  .level { font-size: 13px; color: #89b4fa; margin-top: 2px; }
  .controls { font-size: 12px; line-height: 1.6; color: #bac2de; }
  .touchbtns {
    display: none;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .touchbtns button {
    width: 100%;
    padding: 14px 0;
    font-size: 20px;
    background: #45475a;
    color: #cdd6f4;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
  }
  .touchbtns button:active { background: #6c7086; }
  button {
    width: 100%;
    padding: 8px;
    background: #f5c2e7;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: #f2a9dd; }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #f38ba8;
    font-size: 28px;
    text-align: center;
  }
  #overlay .sub {
    font-size: 16px;
    color: #a6e3a1;
    margin-top: 10px;
  }
  #overlay .sub.blue { color: #89b4fa; }
  #overlay button {
    width: auto;
    margin-top: 24px;
    padding: 10px 28px;
    font-size: 15px;
  }
  @keyframes flash {
    0% { filter: brightness(3); }
    100% { filter: brightness(1); }
  }
  .clearflash { animation: flash 0.25s linear; }
</style>
</head>
<body>

<div class="container">
  <div id="board"></div>
  <div class="panel">
    <h1>🎮 Tetris</h1>
    <div class="box">
      <h3>SKOR</h3>
      <div class="score" id="score">0</div>
      <div class="high">Rekor: <span id="highScore">0</span></div>
      <div class="level">Level: <span id="level">1</span></div>
    </div>
    <div class="box">
      <h3>BERIKUTNYA</h3>
      <div id="next"></div>
    </div>
    <div class="touchbtns" id="touchBtns">
      <button id="btnLeft" aria-label="Kiri">◀</button>
      <button id="btnRight" aria-label="Kanan">▶</button>
      <button id="btnDown" aria-label="Turun">▼</button>
      <button id="btnRotate" aria-label="Putar">↻</button>
    </div>
    <div class="box controls">
      <h3>KONTROL</h3>
      ← → : geser<br>
      ↓ : turun cepat<br>
      ↑ : putar<br>
      Spasi : jatuh instan<br>
      P : pause
    </div>
    <div class="box controls" id="touchHint" style="display:none">
      <h3>KONTROL TOUCH</h3>
      Geser kiri/kanan di papan : pindah<br>
      Tap papan : putar<br>
      Geser bawah : turun / jatuh cepat<br>
      Atau pakai tombol di bawah papan
    </div>
    <button id="startBtn">Mulai / Restart</button>
    <button id="musicBtn">🔊 Musik: ON</button>
  </div>
</div>

<div id="overlay">
  <div id="overlayText">GAME OVER</div>
  <div class="sub" id="overlaySub"></div>
  <button id="overlayBtn">Main Lagi</button>
</div>

<script>
const COLS = 10, ROWS = 20;
const boardEl = document.getElementById('board');
const nextEl = document.getElementById('next');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const levelEl = document.getElementById('level');
const overlay = document.getElementById('overlay');
const overlayText = document.getElementById('overlayText');
const overlaySub = document.getElementById('overlaySub');
const overlayBtn = document.getElementById('overlayBtn');
const startBtn = document.getElementById('startBtn');
const musicBtn = document.getElementById('musicBtn');
musicBtn.textContent = localStorage.getItem('tetris_music_tmdrkl') !== '0' ? '🔊 Musik: ON' : '🔇 Musik: OFF';

const HIGHSCORE_KEY = 'tetris_highscore_tmdrkl';
const BASE_INTERVAL = 600;
const MIN_INTERVAL = 100;
const LEVEL_LINES = 10;

const COLORS = {
  I: '#89dceb', O: '#f9e2af', T: '#cba6f7',
  S: '#a6e3a1', Z: '#f38ba8', J: '#89b4fa', L: '#fab387'
};

const SHAPES = {
  I: [[1,1,1,1]],
  O: [[1,1],[1,1]],
  T: [[0,1,0],[1,1,1]],
  S: [[0,1,1],[1,1,0]],
  Z: [[1,1,0],[0,1,1]],
  J: [[1,0,0],[1,1,1]],
  L: [[0,0,1],[1,1,1]]
};

let grid, current, next, score, level, totalLines, dropInterval, gameOver, paused, running;
let cellEls = [];
let highScore = parseInt(localStorage.getItem(HIGHSCORE_KEY) || '0', 10) || 0;
highScoreEl.textContent = highScore;

// --- Sound (WebAudio) ---
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  if (musicOn && running && !musicTimer && audioCtx) startMusic();
}
function blip(freq, dur = 0.06, type = 'square', vol = 0.04) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.value = vol;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  osc.stop(audioCtx.currentTime + dur);
}
function sfxMove() { blip(180, 0.03, 'square', 0.02); }
function sfxRotate() { blip(320, 0.04, 'square', 0.03); }
function sfxLock() { blip(140, 0.05, 'triangle', 0.04); }
function sfxClear(n) {
  const base = 500;
  for (let i = 0; i < n; i++) {
    setTimeout(() => blip(base + i * 120, 0.08, 'sawtooth', 0.04), i * 70);
  }
}
function sfxGameOver() { blip(220, 0.15, 'sawtooth', 0.05); setTimeout(() => blip(160, 0.2, 'sawtooth', 0.05), 150); }
function sfxLevelUp() { blip(600, 0.08, 'sine', 0.05); setTimeout(() => blip(800, 0.1, 'sine', 0.05), 80); }

// --- Background music (chiptune loop) ---
let musicOn = localStorage.getItem('tetris_music_tmdrkl') !== '0';
let musicTimer = null;
let musicNext = 0;
let musicStep = 0;
let musicGain = null;
const midi2freq = m => 440 * Math.pow(2, (m - 69) / 12);
const BASS = [
  45,45,-1,45, 45,45,43,45,  41,41,-1,41, 41,41,43,41,
  48,48,-1,48, 48,48,47,48,  43,43,-1,43, 43,43,45,43
];
const LEAD = [
  69,-1,72,-1, 74,-1,72,-1,  69,-1,72,-1, 76,-1,74,-1,
  69,-1,72,-1, 74,-1,72,-1,  76,-1,74,-1, 72,-1,71,-1,
  72,-1,76,-1, 79,-1,76,-1,  77,-1,76,-1, 74,-1,72,-1,
  69,-1,72,-1, 74,-1,72,-1,  71,-1,72,-1, 71,-1,69,-1
];
const STEP = 60 / 150 / 2;

function playNote(midi, t, dur, type, vol, dest) {
  if (midi < 0) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = midi2freq(midi);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain);
  gain.connect(dest);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

function scheduleMusic() {
  if (!audioCtx || !musicGain) return;
  while (musicNext < audioCtx.currentTime + 0.12) {
    playNote(BASS[musicStep], musicNext, STEP * 0.9, 'square', 0.18, musicGain);
    if (musicStep % 2 === 0) playNote(LEAD[musicStep], musicNext, STEP * 0.8, 'triangle', 0.12, musicGain);
    musicNext += STEP;
    musicStep = (musicStep + 1) % 32;
  }
}

function startMusic() {
  if (!musicOn || !audioCtx || musicTimer) return;
  musicGain = audioCtx.createGain();
  musicGain.gain.value = 0.5;
  musicGain.connect(audioCtx.destination);
  musicStep = 0;
  musicNext = audioCtx.currentTime + 0.05;
  scheduleMusic();
  musicTimer = setInterval(scheduleMusic, 60);
}

function stopMusic() {
  clearInterval(musicTimer);
  musicTimer = null;
  if (musicGain && audioCtx) {
    musicGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
    const g = musicGain;
    setTimeout(() => { try { g.disconnect(); } catch (e) {} }, 400);
    musicGain = null;
  }
}

function toggleMusic() {
  ensureAudio();
  if (!audioCtx) return;
  musicOn = !musicOn;
  localStorage.setItem('tetris_music_tmdrkl', musicOn ? '1' : '0');
  musicBtn.textContent = musicOn ? '🔊 Musik: ON' : '🔇 Musik: OFF';
  if (musicOn) startMusic();
  else stopMusic();
}

function buildBoard() {
  boardEl.innerHTML = '';
  cellEls = [];
  for (let r = 0; r < ROWS; r++) {
    const row = [];
    for (let c = 0; c < COLS; c++) {
      const div = document.createElement('div');
      div.className = 'cell';
      boardEl.appendChild(div);
      row.push(div);
    }
    cellEls.push(row);
  }
}

function randomPiece() {
  const keys = Object.keys(SHAPES);
  const type = keys[Math.floor(Math.random() * keys.length)];
  return {
    type,
    shape: SHAPES[type].map(r => r.slice()),
    color: COLORS[type],
    row: 0,
    col: Math.floor((COLS - SHAPES[type][0].length) / 2)
  };
}

function rotate(shape) {
  const rows = shape.length, cols = shape[0].length;
  const result = [];
  for (let c = 0; c < cols; c++) {
    const newRow = [];
    for (let r = rows - 1; r >= 0; r--) {
      newRow.push(shape[r][c]);
    }
    result.push(newRow);
  }
  return result;
}

function collides(shape, row, col) {
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (!shape[r][c]) continue;
      const nr = row + r, nc = col + c;
      if (nc < 0 || nc >= COLS || nr >= ROWS) return true;
      if (nr >= 0 && grid[nr][nc]) return true;
    }
  }
  return false;
}

function ghostRow() {
  let row = current.row;
  while (!collides(current.shape, row + 1, current.col)) row++;
  return row;
}

function lockPiece() {
  const { shape, row, col, color } = current;
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (shape[r][c]) {
        const nr = row + r, nc = col + c;
        if (nr < 0) { endGame(); return; }
        grid[nr][nc] = color;
      }
    }
  }
  sfxLock();
  clearLines();
  current = next;
  next = randomPiece();
  drawNext();
  if (collides(current.shape, current.row, current.col)) {
    endGame();
  }
}

function clearLines() {
  const clearedRows = [];
  for (let r = ROWS - 1; r >= 0; r--) {
    if (grid[r].every(cell => cell)) clearedRows.push(r);
  }
  const cleared = clearedRows.length;
  if (cleared) {
    clearedRows.forEach(r => {
      for (let c = 0; c < COLS; c++) {
        const el = cellEls[r][c];
        el.classList.remove('clearflash');
        void el.offsetWidth;
        el.classList.add('clearflash');
      }
    });
    clearedRows.forEach(r => grid.splice(r, 1));
    for (let i = 0; i < cleared; i++) grid.unshift(new Array(COLS).fill(null));
    const points = [0, 100, 300, 500, 800];
    score += points[cleared] || cleared * 200;
    scoreEl.textContent = score;
    sfxClear(cleared);

    totalLines += cleared;
    const prevLevel = level;
    level = Math.floor(totalLines / LEVEL_LINES) + 1;
    if (level > prevLevel) {
      levelEl.textContent = level;
      sfxLevelUp();
      restartTimer();
    }
  }
}

function draw() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const el = cellEls[r][c];
      el.style.background = grid[r][c] || '#11111b';
      el.style.boxShadow = '';
    }
  }
  if (running && current && !gameOver && !paused) {
    const { shape, row, col, color } = current;
    const gRow = ghostRow();
    for (let r = 0; r < shape.length; r++) {
      for (let c = 0; c < shape[r].length; c++) {
        if (!shape[r][c]) continue;
        const nr = gRow + r, nc = col + c;
        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !grid[nr][nc]) {
          cellEls[nr][nc].style.background = 'transparent';
          cellEls[nr][nc].style.boxShadow = `inset 0 0 0 2px ${color}55`;
        }
      }
    }
    for (let r = 0; r < shape.length; r++) {
      for (let c = 0; c < shape[r].length; c++) {
        if (shape[r][c]) {
          const nr = row + r, nc = col + c;
          if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
            const el = cellEls[nr][nc];
            el.style.background = color;
            el.style.boxShadow = '';
          }
        }
      }
    }
  }
}

function drawNext() {
  nextEl.innerHTML = '';
  const size = 4;
  const grid4 = Array.from({length: size}, () => new Array(size).fill(null));
  const shape = next.shape;
  const offR = Math.floor((size - shape.length) / 2);
  const offC = Math.floor((size - shape[0].length) / 2);
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (shape[r][c]) grid4[r + offR][c + offC] = next.color;
    }
  }
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const div = document.createElement('div');
      div.className = 'cell';
      div.style.background = grid4[r][c] || '#11111b';
      nextEl.appendChild(div);
    }
  }
}

function restartTimer() {
  clearInterval(dropInterval);
  const interval = Math.max(MIN_INTERVAL, BASE_INTERVAL - (level - 1) * 50);
  dropInterval = setInterval(() => move(1, 0), interval);
}

function move(dr, dc) {
  if (!running || gameOver || paused) return;
  const { shape, row, col } = current;
  const nr = row + dr, nc = col + dc;
  if (!collides(shape, nr, nc)) {
    current.row = nr;
    current.col = nc;
    if (dc !== 0) sfxMove();
    draw();
  } else if (dr === 1) {
    lockPiece();
    draw();
  }
}

function hardDrop() {
  if (!running || gameOver || paused) return;
  let dropped = 0;
  while (!collides(current.shape, current.row + 1, current.col)) {
    current.row++;
    dropped++;
  }
  score += dropped * 2;
  scoreEl.textContent = score;
  lockPiece();
  draw();
}

function doRotate() {
  if (!running || gameOver || paused) return;
  const rotated = rotate(current.shape);
  const kicks = [0, -1, 1, -2, 2];
  for (const k of kicks) {
    if (!collides(rotated, current.row, current.col + k)) {
      current.shape = rotated;
      current.col += k;
      sfxRotate();
      draw();
      return;
    }
  }
}

function endGame() {
  if (gameOver) return;
  gameOver = true;
  running = false;
  clearInterval(dropInterval);
  let isNewRecord = false;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem(HIGHSCORE_KEY, String(highScore));
    highScoreEl.textContent = highScore;
    isNewRecord = true;
  }
  overlayText.textContent = 'GAME OVER';
  overlaySub.className = 'sub';
  overlaySub.textContent = isNewRecord ? '🎉 Rekor baru!' : `Skor: ${score}`;
  overlayBtn.style.display = 'block';
  overlay.style.display = 'flex';
  stopMusic();
  sfxGameOver();
}

function togglePause() {
  if (!running || gameOver) return;
  paused = !paused;
  overlay.style.display = paused ? 'flex' : 'none';
  if (paused) {
    overlayText.textContent = 'PAUSE';
    overlaySub.className = 'sub blue';
    overlaySub.textContent = 'Tekan P untuk lanjut';
    overlayBtn.style.display = 'none';
    stopMusic();
  } else {
    draw();
    startMusic();
  }
}

function startGame() {
  ensureAudio();
  clearInterval(dropInterval);
  grid = Array.from({length: ROWS}, () => new Array(COLS).fill(null));
  score = 0;
  level = 1;
  totalLines = 0;
  scoreEl.textContent = 0;
  levelEl.textContent = 1;
  highScoreEl.textContent = highScore;
  gameOver = false;
  paused = false;
  running = true;
  overlay.style.display = 'none';
  overlayText.textContent = '';
  overlaySub.textContent = '';
  current = randomPiece();
  next = randomPiece();
  drawNext();
  draw();
  restartTimer();
  startMusic();
}

function showRestartHint() {
  startBtn.blur();
  overlayBtn.blur();
}

document.addEventListener('keydown', (e) => {
  ensureAudio();
  if (e.key === 'ArrowLeft') { e.preventDefault(); move(0, -1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); move(0, 1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); move(1, 0); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); doRotate(); }
  else if (e.key === ' ') { e.preventDefault(); hardDrop(); }
  else if (e.key.toLowerCase() === 'p' || e.key.toLowerCase() === 'r') {
    if (gameOver) { startGame(); } else { togglePause(); }
  }
});

startBtn.addEventListener('click', () => {
  startGame();
  startBtn.blur();
});
overlayBtn.addEventListener('click', () => {
  startGame();
  overlayBtn.blur();
});
musicBtn.addEventListener('click', () => {
  toggleMusic();
  musicBtn.blur();
});

document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); ensureAudio(); move(0, -1); }, { passive: false });
document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); ensureAudio(); move(0, 1); }, { passive: false });
document.getElementById('btnDown').addEventListener('touchstart', (e) => { e.preventDefault(); ensureAudio(); move(1, 0); }, { passive: false });
document.getElementById('btnRotate').addEventListener('touchstart', (e) => { e.preventDefault(); ensureAudio(); doRotate(); }, { passive: false });
document.getElementById('btnLeft').addEventListener('mousedown', (e) => { ensureAudio(); move(0, -1); });
document.getElementById('btnRight').addEventListener('mousedown', (e) => { ensureAudio(); move(0, 1); });
document.getElementById('btnDown').addEventListener('mousedown', (e) => { ensureAudio(); move(1, 0); });
document.getElementById('btnRotate').addEventListener('mousedown', (e) => { ensureAudio(); doRotate(); });

// --- Swipe gesture langsung di papan (untuk touchscreen) ---
let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
const SWIPE_THRESHOLD = 20;

boardEl.addEventListener('touchstart', (e) => {
  ensureAudio();
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchStartTime = Date.now();
}, { passive: true });

boardEl.addEventListener('touchend', (e) => {
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const dt = Date.now() - touchStartTime;
  const absX = Math.abs(dx), absY = Math.abs(dy);

  if (absX < 10 && absY < 10 && dt < 250) {
    doRotate();
    return;
  }
  if (absX > absY) {
    if (absX > SWIPE_THRESHOLD) move(0, dx > 0 ? 1 : -1);
  } else {
    if (dy > SWIPE_THRESHOLD * 3) hardDrop();
    else if (dy > SWIPE_THRESHOLD) move(1, 0);
  }
}, { passive: true });

buildBoard();
startGame();
</script>

</body>
</html>
