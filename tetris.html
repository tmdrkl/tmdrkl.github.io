<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tetris Sederhana</title>
<style>
  * { touch-action: manipulation; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e1e2e;
    font-family: 'Courier New', monospace;
    color: #cdd6f4;
    padding: 16px;
    box-sizing: border-box;
  }
  .container {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* Touch controls, tersembunyi di desktop */
  #touchControls {
    display: none;
    width: 100%;
    max-width: 320px;
    margin-top: 16px;
    user-select: none;
  }
  .tc-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }
  .tc-btn {
    flex: 1;
    background: #313244;
    border: 2px solid #45475a;
    border-radius: 10px;
    color: #cdd6f4;
    font-size: 22px;
    padding: 14px 0;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .tc-btn:active {
    background: #45475a;
  }
  .tc-btn.wide { font-size: 15px; font-weight: bold; }
  .tc-btn.rotate { color: #cba6f7; }
  .tc-btn.drop { color: #f9e2af; }
  .tc-btn.pause { color: #89b4fa; }

  @media (max-width: 640px) {
    #touchControls { display: block; }
    #board { grid-template-columns: repeat(10, 26px); grid-template-rows: repeat(20, 26px); }
    .cell { width: 26px; height: 26px; }
    .panel .box.controls:not(#touchHint) { display: none; }
    #touchHint { display: block !important; }
  }
  #board {
    background: #181825;
    border: 4px solid #45475a;
    border-radius: 8px;
    display: grid;
    grid-template-columns: repeat(10, 28px);
    grid-template-rows: repeat(20, 28px);
    gap: 1px;
  }
  .cell {
    width: 28px;
    height: 28px;
    background: #11111b;
    border-radius: 2px;
  }
  .panel {
    width: 180px;
  }
  .panel h1 {
    font-size: 20px;
    margin-bottom: 8px;
    color: #f5c2e7;
  }
  .box {
    background: #181825;
    border: 2px solid #45475a;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 16px;
  }
  .box h3 {
    margin: 0 0 8px 0;
    font-size: 14px;
    color: #94e2d5;
  }
  #next {
    display: grid;
    grid-template-columns: repeat(4, 20px);
    grid-template-rows: repeat(4, 20px);
    gap: 1px;
    margin: 0 auto;
  }
  #next .cell { width: 20px; height: 20px; }
  .score { font-size: 22px; color: #a6e3a1; }
  .controls { font-size: 12px; line-height: 1.6; color: #bac2de; }
  button {
    width: 100%;
    padding: 8px;
    background: #f5c2e7;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: #f2a9dd; }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #f38ba8;
    font-size: 28px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="container">
  <div id="board"></div>
  <div class="panel">
    <h1>🎮 Tetris</h1>
    <div class="box">
      <h3>SKOR</h3>
      <div class="score" id="score">0</div>
    </div>
    <div class="box">
      <h3>BERIKUTNYA</h3>
      <div id="next"></div>
    </div>
    <div class="box controls">
      <h3>KONTROL</h3>
      ← → : geser<br>
      ↓ : turun cepat<br>
      ↑ : putar<br>
      Spasi : jatuh instan<br>
      P : pause
    </div>
    <div class="box controls" id="touchHint" style="display:none">
      <h3>KONTROL TOUCH</h3>
      Geser kiri/kanan di papan : pindah<br>
      Tap papan : putar<br>
      Geser bawah : turun / jatuh cepat<br>
      Atau pakai tombol di bawah papan
    </div>
    <button id="startBtn">Mulai / Restart</button>
  </div>
</div>

<div id="touchControls">
  <div class="tc-row">
    <div class="tc-btn wide pause" id="btnPause">⏸ Pause</div>
    <div class="tc-btn rotate" id="btnRotate">⟳ Putar</div>
  </div>
  <div class="tc-row">
    <div class="tc-btn" id="btnLeft">←</div>
    <div class="tc-btn" id="btnDown">↓</div>
    <div class="tc-btn" id="btnRight">→</div>
  </div>
  <div class="tc-row">
    <div class="tc-btn wide drop" id="btnDrop">⤓ Jatuh Instan</div>
  </div>
</div>

<div id="overlay">
  <div id="overlayText">GAME OVER</div>
</div>

<script>
const COLS = 10, ROWS = 20;
const boardEl = document.getElementById('board');
const nextEl = document.getElementById('next');
const scoreEl = document.getElementById('score');
const overlay = document.getElementById('overlay');
const overlayText = document.getElementById('overlayText');

const COLORS = {
  I: '#89dceb', O: '#f9e2af', T: '#cba6f7',
  S: '#a6e3a1', Z: '#f38ba8', J: '#89b4fa', L: '#fab387'
};

const SHAPES = {
  I: [[1,1,1,1]],
  O: [[1,1],[1,1]],
  T: [[0,1,0],[1,1,1]],
  S: [[0,1,1],[1,1,0]],
  Z: [[1,1,0],[0,1,1]],
  J: [[1,0,0],[1,1,1]],
  L: [[0,0,1],[1,1,1]]
};

let grid, current, next, score, dropInterval, gameOver, paused;
let cellEls = [];

function buildBoard() {
  boardEl.innerHTML = '';
  cellEls = [];
  for (let r = 0; r < ROWS; r++) {
    const row = [];
    for (let c = 0; c < COLS; c++) {
      const div = document.createElement('div');
      div.className = 'cell';
      boardEl.appendChild(div);
      row.push(div);
    }
    cellEls.push(row);
  }
}

function randomPiece() {
  const keys = Object.keys(SHAPES);
  const type = keys[Math.floor(Math.random() * keys.length)];
  return {
    type,
    shape: SHAPES[type].map(r => r.slice()),
    color: COLORS[type],
    row: 0,
    col: Math.floor((COLS - SHAPES[type][0].length) / 2)
  };
}

function rotate(shape) {
  const rows = shape.length, cols = shape[0].length;
  const result = [];
  for (let c = 0; c < cols; c++) {
    const newRow = [];
    for (let r = rows - 1; r >= 0; r--) {
      newRow.push(shape[r][c]);
    }
    result.push(newRow);
  }
  return result;
}

function collides(shape, row, col) {
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (!shape[r][c]) continue;
      const nr = row + r, nc = col + c;
      if (nc < 0 || nc >= COLS || nr >= ROWS) return true;
      if (nr >= 0 && grid[nr][nc]) return true;
    }
  }
  return false;
}

function lockPiece() {
  const { shape, row, col, color } = current;
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (shape[r][c]) {
        const nr = row + r, nc = col + c;
        if (nr < 0) { endGame(); return; }
        grid[nr][nc] = color;
      }
    }
  }
  clearLines();
  current = next;
  next = randomPiece();
  drawNext();
  if (collides(current.shape, current.row, current.col)) {
    endGame();
  }
}

function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (grid[r].every(cell => cell)) {
      grid.splice(r, 1);
      grid.unshift(new Array(COLS).fill(null));
      cleared++;
      r++;
    }
  }
  if (cleared) {
    const points = [0, 100, 300, 500, 800];
    score += points[cleared] || cleared * 200;
    scoreEl.textContent = score;
  }
}

function draw() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      cellEls[r][c].style.background = grid[r][c] || '#11111b';
    }
  }
  const { shape, row, col, color } = current;
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (shape[r][c]) {
        const nr = row + r, nc = col + c;
        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
          cellEls[nr][nc].style.background = color;
        }
      }
    }
  }
}

function drawNext() {
  nextEl.innerHTML = '';
  const size = 4;
  const grid4 = Array.from({length: size}, () => new Array(size).fill(null));
  const shape = next.shape;
  const offR = Math.floor((size - shape.length) / 2);
  const offC = Math.floor((size - shape[0].length) / 2);
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (shape[r][c]) grid4[r + offR][c + offC] = next.color;
    }
  }
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const div = document.createElement('div');
      div.className = 'cell';
      div.style.background = grid4[r][c] || '#11111b';
      nextEl.appendChild(div);
    }
  }
}

function move(dr, dc) {
  if (gameOver || paused) return;
  const { shape, row, col } = current;
  const nr = row + dr, nc = col + dc;
  if (!collides(shape, nr, nc)) {
    current.row = nr;
    current.col = nc;
    draw();
  } else if (dr === 1) {
    lockPiece();
    draw();
  }
}

function hardDrop() {
  if (gameOver || paused) return;
  while (!collides(current.shape, current.row + 1, current.col)) {
    current.row++;
  }
  lockPiece();
  draw();
}

function doRotate() {
  if (gameOver || paused) return;
  const rotated = rotate(current.shape);
  const kicks = [0, -1, 1, -2, 2];
  for (const k of kicks) {
    if (!collides(rotated, current.row, current.col + k)) {
      current.shape = rotated;
      current.col += k;
      draw();
      return;
    }
  }
}

function endGame() {
  gameOver = true;
  clearInterval(dropInterval);
  overlayText.textContent = `GAME OVER\nSkor: ${score}`;
  overlay.style.whiteSpace = 'pre-line';
  overlay.style.display = 'flex';
}

function togglePause() {
  if (gameOver) return;
  paused = !paused;
  overlay.style.display = paused ? 'flex' : 'none';
  overlayText.textContent = 'PAUSE';
}

function startGame() {
  grid = Array.from({length: ROWS}, () => new Array(COLS).fill(null));
  score = 0;
  scoreEl.textContent = 0;
  gameOver = false;
  paused = false;
  overlay.style.display = 'none';
  current = randomPiece();
  next = randomPiece();
  drawNext();
  draw();
  clearInterval(dropInterval);
  dropInterval = setInterval(() => move(1, 0), 600);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') move(0, -1);
  else if (e.key === 'ArrowRight') move(0, 1);
  else if (e.key === 'ArrowDown') move(1, 0);
  else if (e.key === 'ArrowUp') doRotate();
  else if (e.key === ' ') { e.preventDefault(); hardDrop(); }
  else if (e.key.toLowerCase() === 'p') togglePause();
});

document.getElementById('startBtn').addEventListener('click', startGame);

// --- Touch buttons ---
function bindTap(id, fn) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', (e) => { e.preventDefault(); fn(); }, { passive: false });
  el.addEventListener('click', fn);
}
bindTap('btnLeft', () => move(0, -1));
bindTap('btnRight', () => move(0, 1));
bindTap('btnDown', () => move(1, 0));
bindTap('btnRotate', () => doRotate());
bindTap('btnDrop', () => hardDrop());
bindTap('btnPause', () => togglePause());

// --- Swipe gesture langsung di papan ---
let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
const SWIPE_THRESHOLD = 24;

boardEl.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchStartTime = Date.now();
}, { passive: true });

boardEl.addEventListener('touchend', (e) => {
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const dt = Date.now() - touchStartTime;
  const absX = Math.abs(dx), absY = Math.abs(dy);

  if (absX < 10 && absY < 10 && dt < 250) {
    // tap singkat = putar
    doRotate();
    return;
  }
  if (absX > absY) {
    if (absX > SWIPE_THRESHOLD) move(0, dx > 0 ? 1 : -1);
  } else {
    if (dy > SWIPE_THRESHOLD * 3) hardDrop();
    else if (dy > SWIPE_THRESHOLD) move(1, 0);
  }
}, { passive: true });

buildBoard();
startGame();
</script>

</body>
</html>
